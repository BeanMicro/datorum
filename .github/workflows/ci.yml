name: CI

on:
  # No push trigger for master: deploy-dev.yml calls this workflow as its gate,
  # so a master push would otherwise run the whole suite twice.
  pull_request:
  workflow_dispatch:
  # Lets deploy-dev.yml gate the image build on a green CI run without
  # duplicating the job definitions.
  workflow_call:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The workspace lists QualityEngineering/cucumber-rs, .../goose and
          # .../cucumber-rs/codegen as members, so without submodules cargo
          # cannot even load the manifest. They resolve over anonymous HTTPS,
          # so the default GITHUB_TOKEN is enough - no deploy key needed.
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      # Scoped to the crates this repository owns. `--workspace` would also run
      # the vendored goose and cucumber-rs suites (36 integration test files
      # that bind ports and spin up mock servers); those are upstream's tests
      # and upstream already runs them.
      - name: Unit and integration tests
        run: |
          cargo test -p datorum-server \
                     -p datorum-postgres-wire-steps --lib \
                     -p e2e \
                     -p steps

      - name: PostgresWire tests
        run: cargo test -p datorum-postgres-wire --lib --bins --test example --test ssl_test

      # The cucumber target lives in the steps crate: it drives the server
      # library directly, and keeping it in datorum-postgres-wire would make
      # that a dependency cycle.
      - name: Gherkin suite
        run: cargo test -p datorum-postgres-wire-steps --test cucumber

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: |
          cargo fmt -p datorum-postgres-wire \
                    -p datorum-postgres-wire-steps \
                    -p datorum-server \
                    -p e2e \
                    -p steps \
                    -- --check

      # Blocking: every crate here opts into [workspace.lints], which denies
      # clippy::all. `-D warnings` is deliberately not passed on the command
      # line, because that would also apply to the vendored workspace members.
      - name: Clippy
        run: |
          cargo clippy -p datorum-postgres-wire \
                       -p datorum-postgres-wire-steps \
                       -p datorum-server \
                       -p e2e \
                       -p steps \
                       --all-targets
