name: Deploy (dev)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  # Nothing is published unless the full CI suite passes on this commit.
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The Dockerfile builds a cargo workspace whose members include the
          # submodules, so the build context must carry them.
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=dev

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to dev
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Deploy
        run: |
          echo "Image built and pushed: ${{ needs.image.outputs.image }}"
          echo "Digest: ${{ needs.image.outputs.digest }}"
          echo
          echo "No deploy step is configured yet - the target host has not been"
          echo "chosen. Replace this step with the platform's action, for example:"
          echo "  Fly.io    superfly/flyctl-actions/setup-flyctl + 'flyctl deploy -i \$IMAGE'"
          echo "  ECS       aws-actions/amazon-ecs-deploy-task-definition"
          echo "  k8s       'kubectl set image deployment/datorum datorum=\$IMAGE'"
          echo "  Plain VM  appleboy/ssh-action running 'docker compose pull && up -d'"
          echo
          echo "Credentials belong in the 'dev' GitHub Environment as secrets."
